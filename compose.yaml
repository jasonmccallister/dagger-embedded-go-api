services:
  dagger-engine:
    image: registry.dagger.io/engine:v0.18.5
    ports:
      - "1234:1234"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - CAP_SYS_ADMIN
    privileged: true
    command: "--addr tcp://0.0.0.0:1234"
    volumes:
      - dagger-engine:/var/lib/dagger
volumes:
  dagger-engine:
